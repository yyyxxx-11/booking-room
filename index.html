<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5ef">
  <meta name="description" content="单会议室共享预约工具">
  <title>会议室预约</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="会议室预约首页">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>
        <strong id="room-name">会议室</strong>
        <small>共享预约</small>
      </span>
    </a>
    <button class="identity-button" id="identity-button" type="button" aria-label="设置预约人姓名">
      <span class="avatar" id="avatar">?</span>
      <span id="identity-label">设置姓名</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </header>

  <main>
    <section class="date-panel" aria-labelledby="date-heading">
      <div>
        <p class="eyebrow">单会议室 · 每次 30 分钟</p>
        <h1 id="date-heading"><span id="selected-date-label">今天</span>的安排</h1>
        <p class="timezone-note" id="timezone-note">房间时间 08:30–17:30</p>
      </div>
      <div class="date-controls">
        <button class="icon-button" id="previous-day" type="button" aria-label="前一天" title="前一天">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="today-button" id="today-button" type="button">今天</button>
        <button class="icon-button" id="next-day" type="button" aria-label="后一天" title="后一天">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <label class="calendar-button" title="选择日期">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/></svg>
          <input id="date-picker" type="date" aria-label="选择日期">
        </label>
      </div>
    </section>

    <section class="schedule" aria-label="预约时间表">
      <div class="schedule-heading">
        <div class="status-key"><span class="status-dot available"></span>可预约 <span class="status-dot booked"></span>已预约</div>
        <button class="refresh-button" id="refresh-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          刷新
        </button>
      </div>
      <div class="slot-list" id="slot-list" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span>正在读取预约...</div>
      </div>
    </section>
  </main>

  <dialog id="identity-dialog" class="dialog">
    <form id="identity-form" method="dialog">
      <div class="dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
      </div>
      <h2>你叫什么名字？</h2>
      <p>其他人会在你预约的时间段看到这个名字。</p>
      <label for="display-name">姓名</label>
      <input id="display-name" name="displayName" maxlength="40" autocomplete="name" placeholder="例如：王小明" required>
      <div class="dialog-actions">
        <button class="text-button" type="button" data-close-dialog>取消</button>
        <button class="primary-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="booking-dialog" class="dialog">
    <form id="booking-form" method="dialog">
      <div class="dialog-icon booking" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 6v6l4 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
      </div>
      <h2>确认预约</h2>
      <p id="booking-summary"></p>
      <input id="booking-slot" type="hidden">
      <label for="booking-purpose">用途 <span>选填</span></label>
      <input id="booking-purpose" maxlength="80" placeholder="例如：项目周会">
      <div class="dialog-actions">
        <button class="text-button" type="button" data-close-dialog>返回</button>
        <button class="primary-button" type="submit">确认预约</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer><span id="footer-room-name">会议室</span><span>预约数据实时同步</span></footer>
</body>
</html>
